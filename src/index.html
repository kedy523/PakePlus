  /* 2. 五分钟上手 */
  h.push(card("② 五分钟上手", "标准流程", `
    <ol class="hp-list">
      <li><b>基础配置</b>：确认工艺路线、各产品线的工序清单正确（一般由工程维护，日常不用改）。</li>
      <li><b>机种工时</b>：选产品线 → 搜索/点选机种 → 选工艺路线 → 在工序格子里填「机器」「人工」工时，<b>单元格失焦即自动保存</b>。</li>

  /* 3. 工时口径 */
  h.push(card("③ 工时计算口径", "制费工时怎么来的", `

  /* 4. 机种字段规则 */

      ["背光", "产品线-型号-产品工艺组合-芯片组合-显指", "背光-…-正装…-双串-80"],
      ["显示", "产品线-型号-编码前2位", "显示-1010产品-7S"],
      ["COB", "产品线-型号-芯片组合-显指", "COB-MF190K-58串2并-80"],
      ["灯丝", "产品线-型号-芯片组合-镭射-电阻-点胶-显指", "灯丝-MC4015-38串1并-镭射-无电阻-一次点胶-90"],
      ["车灯", "产品线-型号-芯片串并-齐纳-显指", "车灯-2720-单晶-垂直齐纳-单色光"]

    <p class="hp-p" style="margin-top:14px"><b>关键字段怎么取</b></p>
    ${tbl(["字段", "规则"], [
      ["型号（照明/背光）", "查参数字典：产品线 + 编码第 4~5 位 → 型号（如 787K8…→2837）"],
      ["型号（显示）", "查参数字典：显示- + 编码第 4~6 位（如 100→1010产品）"],
      ["型号（COB/灯丝）", "描述提取：取描述中 { 后到第一个 - 之间的文本（如 {MC4015-…}→MC4015）"],
      ["型号（车灯）", "编码第 3~6 位（762720…→2720）"],
      ["有球无球（照明）", "描述含「无球」→无球，否则→有球"],
      ["产品工艺组合", "查参数字典：产品线 + 编码第 3 位 → 工艺组合文本"],
      ["芯片组合（COB）", "编码第 7~10 位：前2位+串+后2位+并（5802→58串2并）"],
      ["芯片组合（灯丝）", "编码第 8~11 位：前2位+串+后2位+并（3801→38串1并）"],
      ["芯片串并（车灯）", "编码第 11 位：1单晶 / 2双串 / 3三串 / 4双串双并 / B双并"],

      ["是否镭射（灯丝）", "编码第 14 位 = 6 → 镭射，否则无镭射"],
      ["是否电阻（灯丝）", "编码第 12 位 = H → 电阻，否则无电阻"],
      ["点胶（灯丝）", "描述含「白色/二次点胶/双层点胶」任一 → 二次点胶，否则一次点胶"],
      ["显指", "查参数字典：按产品线取编码特定位（照明/背光/灯丝第8/…位、COB第14位、车灯第9位）"]

      ["1 保险丝特例", "描述含「保险丝」→ 芯片组合 = 保险丝"],
      ["2 串/并正则", "按 (中文数字|两双|数字)+(串|并) 提取，转换后拼成「双串」「八串双并」等"],
      ["3 单晶/单芯", "描述含「单晶」或「单芯」→ 单晶"],
      ["4 N晶串/并", "按 (…|两双|数字)晶(串|并) 提取，如「8晶串」→ 八串"],
      ["5 无规律回查", "以上都不中→无规律，再按料号回查参数表 A:B（料号→芯片组合），命中即用，否则无结果"]
    ])}
    <div class="hp-warn"><b>兜底规则：</b>产品线未知，或任一关键字段缺失 / 返回「无结果」「无规律」 → 整条机种输出<b>「编码不符合命名规则」</b>，需人工到料号页手动指定机种。</div>`));

  /* 5. 各页怎么用 */
  h.push(card("⑤ 各页面怎么用", "逐页说明", `
    ${tbl(["页面", "作用", "要点"], [
      ["机种工时", "维护 产品线→机种→工艺路线→各工序 的机器/人工工时", "机种支持模糊搜索与清单点选；表格失焦即存；可「增加机种」「删除当前机种」"],
      ["料号工时", "录物料编码与描述 → 自动推导机种 → 自动拉取工时并算制费", "每页 20 条，支持按产品线/工艺路线/关键字/异常筛选；可单个编辑、批量导入导出 CSV"],
      ["基础配置", "维护工艺路线与各产品线的工序清单", "工序增删改会同步影响所有已录工时，请谨慎"],

      <li>建议直接复制同产品线已有机种键再改字段，避免手输出错。</li>
    </ul>`));

  /* 6. 导入导出 */
  h.push(card("⑥ 导入 / 导出（机种工时用 xlsx，料号用 CSV）", "备份与批量", `
    <ul class="hp-list">
      <li><b>机种工时 xlsx</b>：<b>每个产品线一个工作表</b>（照明机种工时 / 背光机种工时 …），表头是「机种键、产品线、机器/人工、工艺路线、工时」+ 该产品线<b>全部工序各一列</b>；一行 = 一个「机种 × 工艺路线 × 机器或人工」，「工时」列是这一行各工序之和（派生列，导入时忽略）。</li>
      <li>机种工时导入为<b>单元格级覆盖</b>：表里<b>填了数值的工序才更新</b>，<b>工序单元格留空 = 保持原值</b>（想清零请填 0），表里没出现的工序也保持原值。旧版 CSV 长格式（表头 <code>产品线,机种键,机器/人工,工艺路线,工序,工时</code>）仍可直接导入。</li>
      <li><b>料号工时 CSV</b>：需含「<b>物料编码</b>」表头，可选列：物料描述 / 工艺路线 / 备注。</li>
      <li>料号 CSV 导出为 <b>UTF-8 带 BOM</b>，Excel 双击直接打开不乱码；导入兼容 UTF-8 与 GBK。机种工时 xlsx 本身就是标准 Excel 工作簿，双击即可打开。</li>
      <li>导入时未建档且前缀不符的机种会被<b>整组拒绝</b>，并在预览里列出原因。</li>
      <li><b>整库备份</b>用 JSON（数据管理页）：JSON 一次完整还原所有数据（含工艺路线、机种清单等基础配置），xlsx / CSV 只承载工时与料号。</li>
      <li><b>保存位置</b>：所有导出都会弹出「另存为」对话框，<b>文件夹和文件名都由你自己定</b>；文件名的日期已精确到分钟，同一天导出多次不会重名。</li>
      <li><b>默认位置可以在「系统设置 → 保存位置」里分别指定</b>：<b>工时导出位置</b>管「机种工时 xlsx / 下载 xlsx 模板 / 料号工时 CSV」，<b>JSON 备份位置</b>管「导出 JSON 备份」，两者互不干扰（各点一次「选择文件夹」授权即可）。</li>
      <li>没指定时的回落顺序：<b>① 上次导出过的位置 → ② 桌面</b>。位置只记在<b>这台电脑的这个浏览器</b>里，不上传、也不进备份；换浏览器或清理浏览器数据后需重新指定一次。</li>
      <li>若你的浏览器不支持「另存为」对话框（如 Firefox / Safari），会自动回落为浏览器下载；此时可在浏览器的「设置 → 下载内容」里开启<b>「下载前询问每个文件的保存位置」</b>，照样能每次自选位置。</li>
    </ul>`));

  /* 7. 常见问题 */
  h.push(card("⑦ 常见问题", "", `
    ${tbl(["现象", "原因 / 处理"], [
      ["机种显示「编码不符合命名规则」", "编码前缀不认识，或关键字段缺失/无规律 → 人工在料号页手动指定机种"],
      ["制费工时显示「缺工时」", "该机种在所选工艺路线下还没录工时 → 到机种工时页补录"],
      ["增加机种时提示不属于该产品线", "机种名第一个「-」前必须等于产品线名，按规则改名后重试"],
      ["导入 CSV 后没变化", "检查表头是否与模板一致、编码列是否为文本；导入前会先给预览，确认无误再应用"],

      ["忘记密码了", "让系统管理员在「系统设置 → 账号管理」点「重置密码」；管理员自己忘了只能清掉浏览器数据重新初始化（会连带清掉工时数据，<b>请先导出 JSON 备份</b>）"],

    ])}`));

  h.push(`<div class="card"><div class="muted" style="line-height:1.8">本说明依据《机种字段映射图》《机种字段取值规则清单》整理，与平台内置推导引擎（28 个种子机种逐字段校验一致）保持同步。如规则有调整，请以工程发布的最新版《机种字段取值规则清单》为准。</div></div>`);

  $("#page-help").innerHTML = h.join("");
