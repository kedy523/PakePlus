<!DOCTYPE html>

<title>工时统计平台</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --ink:#1f2a37; --sub:#667085;
  --brand:#1d4ed8; --brand-d:#1e40af; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --chip:#eef2ff; --chipink:#3730a3; --soft:#f8fafc;
  --side1:#0d1f3c; --side2:#122a50; --side-ink:#cbd5e1; --side-dim:#8ea2c0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
#app{display:flex;min-height:100vh}
/* ---- 左侧深色导航 ---- */
#side{flex:none;width:226px;background:linear-gradient(180deg,var(--side1),var(--side2));color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px;box-shadow:0 4px 10px rgba(2,132,199,.35)}
.brand h1{margin:0;font-size:16px;font-weight:700;color:#fff;line-height:1.25;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--side-dim);display:block;margin-top:2px}
.nav-label{padding:8px 18px 6px;font-size:11px;color:#5b7290;letter-spacing:1px}
#nav{display:flex;flex-direction:column;gap:4px;padding:0 10px}
#nav .navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;border-radius:10px;background:transparent;color:var(--side-ink);cursor:pointer;font-size:14px;text-align:left;min-height:42px;font-family:inherit}
#nav .navbtn svg{flex:none;opacity:.85}
#nav .navbtn:hover{background:rgba(255,255,255,.07)}
#nav .navbtn.active{background:linear-gradient(90deg,#14b8a6,#0d9488);color:#fff;box-shadow:0 4px 12px rgba(20,184,166,.3)}
#nav .navbtn.active svg{opacity:1}
#nav .navbtn .bdg{margin-left:auto;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.side-foot{margin-top:auto;padding:12px 12px 16px;border-top:1px solid rgba(255,255,255,.08)}
#acctBox{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px;border-radius:10px;min-height:52px}
#acctBox:hover{background:rgba(255,255,255,.07)}
#acctBox .avatar{width:36px;height:36px;flex:none;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
#acctBox .avatar.off{background:#475569;color:#cbd5e1}
#acctBox .ai{min-width:0}
#acctBox .ai b{display:block;font-size:13px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acctBox .ai span{font-size:11px;color:var(--side-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* ---- 主列 ---- */
#mainCol{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
#pageTitle{font-size:17px;font-weight:600}
#pageSub{font-size:12px;color:var(--sub);margin-left:10px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
#updTime,#bkTime{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
#bkTime{padding-left:12px;border-left:1px solid var(--line)}
#acctBtnM{display:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;align-items:center;justify-content:center}
main{padding:16px 18px 40px;flex:1}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .tag{font-size:11px;color:var(--sub);font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .n{font-size:22px;font-weight:700;color:var(--brand-d)}
.kpi .l{font-size:12px;color:var(--sub);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:#f1c6c6}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=password],textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);min-height:40px}
select:focus,input:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--brand)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
label.fl > span{padding-left:2px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
#matTblBox .tblwrap{max-height:62vh;overflow-y:auto}
#matTblBox .tblwrap thead th{position:sticky;top:0;z-index:2;background:var(--soft);box-shadow:0 1px 0 var(--line)}
#page-data table.even{table-layout:fixed;min-width:560px}
#page-data table.even th,#page-data table.even td{text-align:left;padding-left:12px;padding-right:12px}
/* 使用说明页 */
.hp-list{margin:6px 0 0;padding-left:20px;line-height:1.9}
.hp-list li{margin-bottom:4px}
.hp-p{margin:12px 0 6px;line-height:1.7}
.hp-formula{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--brand-d);margin:6px 0 10px}
.hp-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub);margin:8px 0}
.hp-legend span{display:flex;align-items:center;gap:5px}
.hp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hp-warn{margin:12px 0 2px;padding:10px 12px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;line-height:1.7;font-size:13px}
#page-help code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12px}
#page-help td{white-space:normal;line-height:1.7}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:var(--soft);color:var(--sub);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table.hours td,table.hours th{padding:4px 6px}
table.hours input{width:104px;min-height:36px;padding:6px 8px;font-size:13px;text-align:right}
table.hours td.sticky,table.hours th.sticky{position:sticky;left:0;background:#fff;z-index:2;box-shadow:2px 0 0 var(--line)}
table.hours th.sticky{background:var(--soft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--chipink)}
.pill.bad{background:#fee2e2;color:#b91c1c}
.pill.ok{background:#dcfce7;color:#15803d}
.pill.warn{background:#fef3c7;color:#b45309}
.muted{color:var(--sub);font-size:12px}
.ellip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.todo{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.todo .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.todo .t{flex:1;min-width:0}
.todo .t b{display:block;font-size:14px}
.todo .t span{font-size:12px;color:var(--sub)}
.todo.bad{border-color:#fecaca;background:#fffafa}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:860px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:99;display:none;max-width:88vw}
.toast.show{display:block}
.toast.err{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;min-height:36px;font-family:inherit}
.tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
/* ---- 登录门禁（未登录时不渲染任何业务数据） ---- */
body.locked #app{visibility:hidden}
.login-gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0c3a4c 0%,#11556c 100%)}
.login-gate.hide{display:none}
.lg-card{width:100%;max-width:392px;background:var(--card);border-radius:16px;padding:26px 24px 20px;box-shadow:0 20px 56px rgba(4,22,32,.38)}
.lg-brand{display:flex;align-items:center;gap:11px}
.lg-brand .lg-logo{width:44px;height:44px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.6px}
.lg-brand h1{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
.lg-brand p{margin:3px 0 0;font-size:12px;color:var(--sub)}
.lg-tip{margin:14px 0 16px;padding:9px 11px;border-radius:9px;background:var(--soft);border:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--sub)}
.lg-err{min-height:19px;margin-top:9px;font-size:12.5px;color:var(--bad)}
.lg-btn{width:100%;height:44px;font-size:15px}
.lg-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--sub);line-height:1.7}
/* ---- 系统设置弹窗 ---- */
.set-sec{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.set-sec.first{margin-top:6px;padding-top:0;border-top:0}
.set-h{font-size:13.5px;font-weight:700;margin-bottom:9px}
.dir-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0}
.dir-row + .dir-row{border-top:1px solid var(--line)}
.dir-row .dr-t{flex:1;min-width:180px;font-size:13px;line-height:1.65}
.dir-row .dr-t b{display:block;font-size:13.5px;margin-bottom:2px}
.dir-row .dr-t span{color:var(--sub);font-size:12px}
.set-ro{font-size:12.5px;color:var(--sub);line-height:1.7;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.role-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chipink);font-weight:600}
.derive-box{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);font-size:13px}
.derive-box.ok{border-color:#86efac;background:#f0fdf4}
.derive-box.bad{border-color:#fca5a5;background:#fef2f2}
.derive-box .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 14px;margin-top:6px}
.derive-box .kv div{font-size:13px}
.derive-box .kv b{color:var(--sub);font-weight:500;margin-right:4px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px;color:var(--sub)}
.banner{border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.proc-list{display:flex;flex-wrap:wrap;gap:6px}
.proc-list .pi{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;font-size:13px}
.proc-list .pi button{border:none;background:none;cursor:pointer;color:var(--sub);font-size:13px;padding:2px 4px;min-height:28px}
.proc-list .pi button:hover{color:var(--brand)}
/* ---- 机种搜索清单 ---- */
.mlist{max-height:196px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.mi{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi:last-child{border-bottom:none}
.mi:hover{background:#f0f7ff}
.mi.cur{background:#e0f2fe;color:#075985;font-weight:600}
footer{padding:14px;text-align:center;color:var(--sub);font-size:12px}
/* ---- 移动端底部导航 ---- */
#mnav{display:none}
@media (max-width:768px){
  #side{display:none}
  #topbar{padding:10px 12px}
  #pageTitle{font-size:15px}
  #pageSub{display:none}
  #updTime,#bkTime{font-size:11px}
  #bkTime{padding-left:8px}
  #acctBtnM{display:flex}
  main{padding:12px 10px 96px}
  .ellip{max-width:130px}
  table.hours input{width:88px}
  #mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 10px rgba(16,24,40,.06)}
  #mnav .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 2px;min-height:50px;border:none;background:none;color:var(--sub);border-radius:8px;cursor:pointer;font-family:inherit;position:relative}
  #mnav .navbtn.active{color:var(--brand)}
  #mnav .navbtn .bdg{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}
}
</style>

<script>
"use strict";
/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtNum(v, digits){
  if (v === null || v === undefined || v === "" || isNaN(Number(v))) return "—";
  const n = Number(v);
  if (n === 0) return "0";
  const d = digits === undefined ? 8 : digits;
  let s = n.toFixed(d);
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s;
}
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.className = "toast"; }, 2600);
}
function openModal(html){ $("#modalBox").innerHTML = html; $("#modalMask").classList.add("show"); }
function closeModal(){ $("#modalMask").classList.remove("show"); $("#modalBox").innerHTML = ""; }
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function downloadText(text, filename, mime){
  downloadBlob(new Blob(["﻿" + text], { type: (mime || "text/plain") + ";charset=utf-8" }), filename);
}
/* ================= 文件另存为（手动选择保存位置） ================= */
const FS_PICK_ID = "gongshi-export";   /* 固定 id（浏览器自带的目录记忆，作兜底） */
let _fsaOK = null;                      /* 能力探测结果缓存，null = 还没探测过 */
/* ---- 保存位置：句柄存 IndexedDB，导出时作为 startIn 传进去 ----
   浏览器自带的「同 id 记住目录」在 file:// 下不可靠（实测不生效）；
   改用官方推荐做法：句柄可序列化 → 存 IndexedDB → 下次作为 startIn 传入。 */
const FS_IDB_NAME = "wb_gongshi_fs";
const FS_IDB_STORE = "handles";
function fsIdbOpen(){
  return new Promise(function(res, rej){
    let rq;
    try { rq = indexedDB.open(FS_IDB_NAME, 1); } catch (e) { rej(e); return; }
    rq.onupgradeneeded = function(){ try { rq.result.createObjectStore(FS_IDB_STORE); } catch (e) {} };
    rq.onsuccess = function(){ res(rq.result); };
    rq.onerror = function(){ rej(rq.error || new Error("indexedDB open failed")); };
  });
}
function fsIdbWrite(mode, fn){
  return fsIdbOpen().then(function(d){
    return new Promise(function(res, rej){
      const tx = d.transaction(FS_IDB_STORE, mode);
      fn(tx.objectStore(FS_IDB_STORE), res, rej);
      tx.onerror = function(){ rej(tx.error || new Error("tx error")); };
      tx.onabort = function(){ rej(tx.error || new Error("tx abort")); };
    });
  });
}
function fsIdbGet(key){
  return fsIdbWrite("readonly", function(st, res, rej){
    const g = st.get(key);
    g.onsuccess = function(){ res(g.result || null); };
    g.onerror = function(){ rej(g.error); };
  });
}
function fsIdbPut(h, key){
  return fsIdbWrite("readwrite", function(st, res){ st.put(h, key); res(true); });
}
function fsIdbDel(key){
  return fsIdbWrite("readwrite", function(st, res){ st.delete(key); res(true); });
}
/* ---- 保存位置：三组槽位 ----
   dirXxx  = 在「系统设置 → 保存位置」里指定的固定文件夹
   lastXxx = 上次导出实际用过的位置（没指定固定文件夹时用它）
   解析顺序：指定文件夹 → 上次用的位置 → 桌面（浏览器内建位置，无需授权）
   三组分别对应：工时类导出 / JSON 备份 / 账号文件 */
const DIR_SLOT  = { hours: "dirHours",  json: "dirJson",  acct: "dirAcct"  };
const LAST_SLOT = { hours: "lastHours", json: "lastJson", acct: "lastAcct" };
const START_IN  = { hours: undefined,   json: undefined,  acct: undefined  };   /* 内存缓存：导出时同步取，不拖慢用户手势 */
function normKind(k){ return (k === "json" || k === "acct") ? k : "hours"; }
function resolveStartInNow(kind){
  const v = START_IN[normKind(kind)];
  if (v === undefined) return "desktop";     /* 还没预热完 → 先给桌面，绝不阻断导出 */
  return v || "desktop";
}
/* 预热：进平台后就把三组槽位读进内存 */
function warmStartIn(){
  ["hours", "json", "acct"].forEach(function(kind){
    fsIdbGet(DIR_SLOT[kind]).then(function(d){
      if (d) return d;
      return fsIdbGet(LAST_SLOT[kind]).then(function(l){ return l || null; });
    }).then(function(h){
      START_IN[kind] = h || null;
    }).catch(function(){ START_IN[kind] = null; });
  });
}
/* 导出成功后记住这次用的位置（内存 + 库），供下次自动定位 */
function rememberLast(kind, handle){
  const k = normKind(kind);
  START_IN[k] = handle || null;
  if (handle) fsIdbPut(handle, LAST_SLOT[k]).catch(function(){});
}
async function pickDirFor(kind){
  const k = normKind(kind);
  const h = await window.showDirectoryPicker({ mode: "readwrite" });
  await fsIdbPut(h, DIR_SLOT[k]);
  START_IN[k] = h;
  return h;
}
async function clearDirFor(kind){
  const k = normKind(kind);
  START_IN[k] = null;
  await fsIdbDel(DIR_SLOT[k]).catch(function(){});
  await fsIdbDel(LAST_SLOT[k]).catch(function(){});
}
function fsaAvailable(){
  if (_fsaOK === null) {
    _fsaOK = (typeof window.showSaveFilePicker === "function") && window.isSecureContext === true;
  }
  return _fsaOK;
}
function extOf(name){ const m = String(name).match(/\.[^.\\/]+$/); return m ? m[0].toLowerCase() : ".txt"; }
function pushSaveLog(name, via){
  try {
    db.meta.saveLog = db.meta.saveLog || [];
    db.meta.saveLog.unshift({ name: name, at: new Date().toISOString(), via: via });
    if (db.meta.saveLog.length > 10) db.meta.saveLog.length = 10;
  } catch (e) {}
}
function fallbackDownload(blob, filename){
  downloadBlob(blob, filename);
  pushSaveLog(filename, "browser");
  saveDB();
  return { ok: true, name: filename, via: "browser" };
}
/* 统一导出入口：优先弹出「另存为」对话框；不支持或被拒时自动回落浏览器下载 */
function saveFileAs(text, filename, mime, opts){
  const o = opts || {};
  const withBOM = o.bom !== false;      /* CSV 需要 BOM 让 Excel 不乱码；JSON 传 bom:false */
  /* o.blob 时直接给二进制（xlsx）；否则按文本 + BOM 组装 */
  const body = (o.blob instanceof Blob)
    ? o.blob
    : new Blob([(withBOM ? "\ufeff" : "") + text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const ext = extOf(filename);
  if (!fsaAvailable()) return Promise.resolve(fallbackDownload(body, filename));
  const tdesc = ext === ".json" ? "JSON 备份文件"
    : (ext === ".xlsx" ? "Excel 工作簿"
    : (ext === ".js" ? "账号文件（JS）" : "CSV 表格文件"));
  const types = [{ description: tdesc, accept: { [mime || "text/plain"]: [ext] } }];
  /* startIn：指定的固定文件夹 → 上次该类型的导出位置 → 桌面 */
  const kind = normKind(o.kind);
  const pick = { id: FS_PICK_ID, suggestedName: filename, types: types };
  const st = resolveStartInNow(kind);
  if (st) pick.startIn = st;
  return window.showSaveFilePicker(pick).catch(function(e){
    /* 句柄失效（原文件被删/移动、或权限过期）时去掉 startIn 再弹一次；用户取消则原样抛出 */
    if (pick.startIn && e && e.name !== "AbortError") {
      delete pick.startIn;
      return window.showSaveFilePicker(pick);
    }
    throw e;
  }).then(function(handle){
    return handle.createWritable().then(function(w){
      return w.write(body).then(function(){ return w.close(); });
    }).then(function(){
      rememberLast(kind, handle);       /* 记住这次的位置，供下次自动定位 */
      pushSaveLog(handle.name || filename, "dialog");
      saveDB();
      return { ok: true, name: handle.name || filename, via: "dialog" };
    });
  }).catch(function(e){

function sumArr(arr){
  if (!arr) return null;
  let s = 0, has = false;
  arr.forEach(v => { if (v !== null && v !== undefined && v !== "" && !isNaN(Number(v))) { s += Number(v); has = true; } });
  return has ? s : null;
}

  };
}

/* ================= CSV 解析（零依赖，支持引号转义；兼容 UTF-8 / GBK 文件） ================= */
function parseCSV(text){
  if (text && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
  }
  row.push(field); rows.push(row);
  while (rows.length && rows[rows.length - 1].every(c => String(c).trim() === "")) rows.pop();
  return rows;
}
async function readTextSmart(file){

  if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
    return new TextDecoder("utf-8").decode(u8);
  }
  const t = new TextDecoder("utf-8").decode(u8);
  if (t.indexOf("�") < 0) return t;
  try { return new TextDecoder("gbk").decode(u8); } catch (e) { return t; }
}

const CN2NUM = {"一":1,"两":2,"双":2,"2":2,"三":3,"3":3,"四":4,"4":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,"十一":11,"十二":12};
const NUM2CN = {1:"一",2:"双",3:"三",4:"四",5:"五",6:"六",7:"七",8:"八",9:"九",10:"十",11:"十一",12:"十二"};
function cn2num(s){ return CN2NUM[String(s).trim()] || 0; }
function num2cn(n){ n = parseInt(n, 10); return NUM2CN[n] || String(n); }

function getChipCombination(desc){
  if (!desc) return "无规律";
  if (desc.indexOf("保险丝") >= 0) return "保险丝";
  const reg1 = /([一二三四五六七八九十]+|[两双]|[0-9]+)([串并])/g;
  const m1 = Array.from(desc.matchAll(reg1));
  if (m1.length) {
    let strParts = "", bingParts = "";
    m1.forEach(m => {
      const n = cn2num(m[1]);
      if (m[2] === "串") strParts = num2cn(n) + "串";
      else if (m[2] === "并") bingParts = num2cn(n) + "并";
    });
    return strParts + bingParts;
  }
  if (desc.indexOf("单晶") >= 0 || desc.indexOf("单芯") >= 0) return "单晶";
  const reg2 = /([一二三四五六七八九十]+|[两双]|[0-9]+)晶([串并])/g;
  const m2 = Array.from(desc.matchAll(reg2));
  if (m2.length) return num2cn(cn2num(m2[0][1])) + m2[0][2];
  return "无规律";
}

function getProductLine(code){
  if (!code) return "未知";
  const a = String(code);
  const p3 = a.slice(0, 3), p2 = a.slice(0, 2);
  if (p3 === "7MF" || p3 === "8MF") return "显示";
  if (p3 === "7MN" || p3 === "8MN") return "背光";
  if (p2 === "7S" || p2 === "8S" || p2 === "7F" || p2 === "8F") return "显示";
  if (p2 === "78") return "照明";
  if (p2 === "79") return "背光";
  if (p2 === "76") return "车灯";
  if (p2 === "7B") return "COB";
  if (p2 === "7M") return "灯丝";
  return "未知";
}

function descModel(desc){
  if (!desc) return "";
  const i = desc.indexOf("{");
  if (i < 0) return "";
  let j = desc.indexOf("-", i + 1);
  if (j < 0) j = desc.length;
  return desc.slice(i + 1, j);
}

function chipFromCode(mid4){
  const n = parseInt(mid4.slice(2, 4), 10);

    required = [res["型号"], res["产品工艺组合"], res["芯片组合"], res["显指"]];
  } else if (line === "显示") {
    res["型号"] = dictGet(D.MODEL_DICT, "显示-" + (a.length >= 6 ? a.slice(3, 6) : ""));
    res["机种"] = [line, res["型号"], a.slice(0, 2)].join("-");
    required = [res["型号"]];
  } else if (line === "COB") {
    res["型号"] = descModel(b);
    if (a.length >= 10) res["芯片组合"] = chipFromCode(a.slice(6, 10));
    if (a.length >= 14) res["显指"] = dictGet(D.COB_XIANZHI, a.slice(13, 14));
    res["机种"] = [line, res["型号"], res["芯片组合"], res["显指"]].join("-");
    required = [res["型号"], res["芯片组合"], res["显指"]];
  } else if (line === "灯丝") {
    res["型号"] = descModel(b);
    if (a.length >= 11) res["芯片组合"] = chipFromCode(a.slice(7, 11));
    if (a.length >= 14) res["是否镭射"] = a.slice(13, 14) === "6" ? "镭射" : "无镭射";
    if (a.length >= 12) res["是否电阻"] = a.slice(11, 12) === "H" ? "电阻" : "无电阻";
    res["是否二次点胶"] = (b.indexOf("白色") >= 0 || b.indexOf("二次点胶") >= 0 || b.indexOf("双层点胶") >= 0) ? "二次点胶" : "一次点胶";
    if (a.length >= 15) res["显指"] = dictGet(D.XIANZHI_NO, a.slice(14, 15));
    res["机种"] = [line, res["型号"], res["芯片组合"], res["是否镭射"], res["是否电阻"], res["是否二次点胶"], res["显指"]].join("-");
    required = [res["型号"], res["芯片组合"], res["是否镭射"], res["是否电阻"], res["是否二次点胶"], res["显指"]];
  } else if (line === "车灯") {
    if (a.length >= 6) res["型号"] = a.slice(2, 6);
    if (a.length >= 11) res["芯片串并"] = dictGet({"1":"单晶","2":"双串","3":"三串","4":"双串双并","B":"双并"}, a.slice(10, 11));
    if (a.length >= 12) res["齐纳"] = dictGet({"0":"无齐纳","1":"垂直齐纳","2":"倒装齐纳"}, a.slice(11, 12));
    if (a.length >= 9) res["显指"] = dictGet(D.CHEDENG_XZ, a.slice(8, 9));
    res["机种"] = [line, res["型号"], res["芯片串并"], res["齐纳"], res["显指"]].join("-");
    required = [res["型号"], res["芯片串并"], res["齐纳"], res["显指"]];
  } else {
    res["符合命名规则"] = false;
    res["机种"] = "编码不符合命名规则";
    notes.push("产品线未知（编码前缀不在命名规则内）");
    return res;
  }

  if (Object.prototype.hasOwnProperty.call(D.RATIO, line)) {
    res["机器比例"] = D.RATIO[line][0];
    res["人工比例"] = D.RATIO[line][1];
  }

  const NAMES = {
    "照明": ["型号", "有球无球", "工艺组合", "芯片组合", "显指"],
    "背光": ["型号", "工艺组合", "芯片组合", "显指"],
    "显示": ["型号"],
    "COB": ["型号", "芯片组合", "显指"],
    "灯丝": ["型号", "芯片组合", "镭射", "电阻", "点胶", "显指"],
    "车灯": ["型号", "芯片串并", "齐纳", "显指"]
  };
  const names = NAMES[line] || [];
  const missing = [];
  names.forEach((nm, i) => {
    const val = required[i];
    if (val === null || val === undefined || String(val).trim() === "" || String(val).trim() === "无结果" || String(val).trim() === "无规律") missing.push(nm);
  });
  if (missing.length) {
    res["符合命名规则"] = false;
    res["机种"] = "编码不符合命名规则";
    notes.push("无法解析字段：" + missing.join("、"));
  }
  return res;
}

/* ================= 机种工时 Excel（每个产品线一个工作表） =================
 * 表头：机种键, 产品线, 机器/人工, 工艺路线, 工时, <该产品线全部工序各一列>
 * 一行 = 一个「机种 × 工艺路线 × 机器/人工」；「工时」列 = 该行各工序之和（派生列，导入时忽略）。
 */
const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const XLSX_FIXED_COLS = ["机种键", "产品线", "机器/人工", "工艺路线", "工时"];
function modelSheetName(line){ return line + "机种工时"; }
function modelSheetHead(line){
  return XLSX_FIXED_COLS.concat(db.procs[line] || []);
}
function modelSheetRows(line){
  const procs = db.procs[line] || [];
  const rows = [modelSheetHead(line)];
  const pick = (arr, i) => {
    const v = arr[i];
    if (v === null || v === undefined || v === "") return null;
    const n = Number(v);
    return isNaN(n) ? null : n;
  };
  (db.models[line] || []).forEach(model => {
    routeList().forEach(rt => {
      if (!db.hours[hKey(line, model, rt)]) return;   /* 没有工时记录的组合不输出 */
      const h = getHours(line, model, rt) || {};
      ["机器", "人工"].forEach(mh => {
        const arr = h[mh] || [];
        const vals = procs.map((p, i) => pick(arr, i));
        if (!vals.some(v => v !== null)) return;   /* 该行一个工序值都没有 → 不输出（与标准模板一致） */
        const sum = vals.reduce((s, v) => s + (v === null ? 0 : v), 0);
        rows.push([model, line, mh, rt, sum].concat(vals));
      });
    });
  });
  return rows;
}
/* 从工作表名解析产品线：「照明机种工时」→「照明」 */
function lineFromSheetName(name){
  return String(name || "").replace(/机种工时\s*$/, "").trim();
}
function modelCsvToEntries(rows){
  const problems = [];
  const hi = rows.findIndex(r => r && r.some(c => String(c || "").trim() === "机种键"));
  if (hi < 0) return { entries: [], problems: ["找不到表头行（需包含：产品线,机种键,机器/人工,工艺路线,工序,工时）"], cells: 0 };
  const head = rows[hi].map(c => String(c || "").trim());
  const col = {};
  head.forEach((h, i) => { col[h] = i; });
  const miss = ["产品线", "机种键", "机器/人工", "工艺路线", "工序"].filter(n => col[n] === undefined);
  if (miss.length) return { entries: [], problems: ["表头缺少列：" + miss.join("、")], cells: 0 };
  const ciVal = col["工时"] !== undefined ? col["工时"] : -1;
  const agg = {};
  let cells = 0;
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const model = String(row[col["机种键"]] || "").trim();
    if (!model) continue;
    const line = String(row[col["产品线"]] || "").trim();
    const mh0 = String(row[col["机器/人工"]] || "").trim();
    const mh = mh0.indexOf("人工") >= 0 ? "人工" : (mh0.indexOf("机器") >= 0 ? "机器" : "");
    const route = String(row[col["工艺路线"]] || "").trim();
    const proc = String(row[col["工序"]] || "").trim();
    const rowNo = r + 1;
    if (db.lines.indexOf(line) < 0) { problems.push("第" + rowNo + "行产品线「" + line + "」不存在，已跳过（机种 " + model + "）"); continue; }
    if (routeList().indexOf(route) < 0) { problems.push("第" + rowNo + "行工艺路线「" + route + "」不存在，已跳过（机种 " + model + "）"); continue; }
    if (!mh) { problems.push("第" + rowNo + "行「机器/人工」列无法识别（" + (mh0 || "空") + "），已跳过"); continue; }
    if (!proc) { problems.push("第" + rowNo + "行工序为空，已跳过"); continue; }
    const procs = db.procs[line] || [];
    if (procs.indexOf(proc) < 0) { problems.push("第" + rowNo + "行工序「" + proc + "」不在「" + line + "」的工序配置中，已跳过"); continue; }
    let val = null;
    if (ciVal >= 0) {
      const raw = row[ciVal];
      if (raw !== null && raw !== undefined && String(raw).trim() !== "") {
        const n = Number(String(raw).trim());
        if (isNaN(n)) problems.push("第" + rowNo + "行工时「" + raw + "」不是数值，按空白处理");
        else val = n;
      }
    }
    const k = line + "|" + model + "|" + route + "|" + mh;
    if (!agg[k]) agg[k] = { line, model, route, mh, procVals: {} };
    agg[k].procVals[proc] = val;
    cells++;
  }
  const entries = Object.keys(agg).map(k => agg[k]);
  return { entries, problems, cells };
}
/* 解析机种工时 xlsx → entries（结构与 modelCsvToEntries 完全一致，便于复用同一套预览/落库逻辑）
 * 识别规则：每个工作表一个产品线；表头含「机种键 / 机器/人工」，其后的非空表头列即为该产品线的工序列；
 * 产品线优先取「产品线」列，缺省时从工作表名解析（「照明机种工时」→ 照明）；「工时」是派生列，导入时忽略。 */
async function modelXlsxToEntries(buf){
  const problems = [], agg = {};
  let cells = 0;
  const book = await XLSXL.read(buf);
  book.sheets.forEach(sh => {
    const rows = sh.rows || [];
    const hi = rows.findIndex(r => r && r.some(c => String(c == null ? "" : c).trim() === "机种键"));
    if (hi < 0) { problems.push("工作表「" + sh.name + "」没找到表头（需含「机种键」列），已跳过"); return; }
    const head = rows[hi].map(c => String(c == null ? "" : c).trim());
    const idxOf = names => { for (let i = 0; i < names.length; i++) { const k = head.indexOf(names[i]); if (k >= 0) return k; } return -1; };
    const cModel = idxOf(["机种键", "机种"]);
    const cLine = idxOf(["产品线"]);
    const cMH = idxOf(["机器/人工", "机器／人工"]);
    const cRoute = idxOf(["工艺路线", "路线"]);
    const cHour = idxOf(["工时"]);
    if (cModel < 0 || cMH < 0) { problems.push("工作表「" + sh.name + "」表头缺少「机种键」或「机器/人工」列，已跳过"); return; }
    /* 工序列 = 这 5 个固定列之后的所有非空表头列，顺序即表头顺序 */
    const lastFixed = Math.max(cModel, cLine, cMH, cRoute, cHour);
    const procCols = [];
    head.forEach((h, i) => { if (i > lastFixed && h) procCols.push({ name: h, idx: i }); });
    if (!procCols.length) { problems.push("工作表「" + sh.name + "」没有识别到工序列（应在「工时」列之后），已跳过"); return; }
    const fromName = lineFromSheetName(sh.name);
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;
      const model = String(row[cModel] == null ? "" : row[cModel]).trim();
      if (!model) continue;
      const where = "「" + sh.name + "」第" + (r + 1) + "行";
      const line = (cLine >= 0 ? String(row[cLine] == null ? "" : row[cLine]).trim() : "") || fromName;
      const mh0 = String(row[cMH] == null ? "" : row[cMH]).trim();
      const mh = mh0.indexOf("人工") >= 0 ? "人工" : (mh0.indexOf("机器") >= 0 ? "机器" : "");
      const route = cRoute >= 0 ? String(row[cRoute] == null ? "" : row[cRoute]).trim() : "";
      if (db.lines.indexOf(line) < 0) { problems.push(where + "产品线「" + line + "」不存在，已跳过（机种 " + model + "）"); continue; }
      if (routeList().indexOf(route) < 0) { problems.push(where + "工艺路线「" + route + "」不存在，已跳过（机种 " + model + "）"); continue; }
      if (!mh) { problems.push(where + "「机器/人工」列无法识别（" + (mh0 || "空") + "），已跳过"); continue; }
      const procs = db.procs[line] || [];
      const k = line + "|" + model + "|" + route + "|" + mh;
      procCols.forEach(pc => {
        const raw = row[pc.idx];
        if (raw === null || raw === undefined || String(raw).trim() === "") return;  /* 空格 = 保持原值，不覆盖 */
        const n = Number(String(raw).trim());
        if (isNaN(n)) { problems.push(where + "工序「" + pc.name + "」的值「" + raw + "」不是数值，已跳过"); return; }
        if (procs.indexOf(pc.name) < 0) { problems.push(where + "工序「" + pc.name + "」不在「" + line + "」的工序配置中，已跳过"); return; }
        if (!agg[k]) agg[k] = { line: line, model: model, route: route, mh: mh, procVals: {} };
        agg[k].procVals[pc.name] = n;
        cells++;
      });
    }
  });
  return { entries: Object.keys(agg).map(k => agg[k]), problems: problems, cells: cells };
}

const MAT_PAGE_SIZE = 20;        /* 未筛选时每页条数 */
const MAT_PAGE_SIZE_FILTERED = 20; /* 有筛选条件时每页条数 */
function matPageSize(){
  const f = state.matFilter;
  const filtered = !!(f && (f.line || f.route || f.q || f.bad));
  return filtered ? MAT_PAGE_SIZE_FILTERED : MAT_PAGE_SIZE;
}
function matFiltered(){
  const f = state.matFilter;
  const q = (f.q || "").trim().toLowerCase();
  return db.materials.filter(m => {
    if (f.line && m["产品线"] !== f.line) return false;
    if (f.route && m["工艺路线"] !== f.route) return false;
    if (f.bad === "fail" && !(m["机种"] === "编码不符合命名规则" || !m["机种"])) return false;
    if (f.bad === "missing" && !((m["机种"] && m["机种"] !== "编码不符合命名规则") && !materialCalc(m).ok)) return false;
    if (q) {
      const hay = (m["物料编码"] + " " + m["物料描述"] + " " + m["机种"]).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function matRouteOptions(cur){

      <button class="btn sm" data-action="mat-page" data-dir="-1" ${state.matPage <= 1 ? "disabled" : ""}>上一页</button>
      <button class="btn sm" data-action="mat-page" data-dir="1" ${state.matPage >= pages ? "disabled" : ""}>下一页</button>
    </div>`;
}

  }
  const r = deriveJizhong(code, desc);
  const ratio = DICTS.RATIO[line] || ["", ""];
  const rec = {
    "产品线": line, "物料编码": code, "物料描述": desc, "机种": model,
    "型号": r["型号"] || "", "产品工艺组合": r["产品工艺组合"] || "", "芯片组合": r["芯片组合"] || "",
    "显指": String(r["显指"] === undefined ? "" : r["显指"]), "是否镭射": r["是否镭射"] || "",
    "是否电阻": r["是否电阻"] || "", "是否二次点胶": r["是否二次点胶"] || "",
    "芯片串并": r["芯片串并"] || "", "齐纳": r["齐纳"] || "",
    "工艺路线": route, "机器比例": ratio[0], "人工比例": ratio[1], "备注": note
  };
  if ((db.models[line] || []).indexOf(model) < 0) {
    db.models[line] = (db.models[line] || []).concat([model]);
    toast("机种已自动加入「" + line + "」机种清单");
  }
  if (id) {
    const m = db.materials.find(x => x.id === id);
    if (m) Object.assign(m, rec);
  } else {
    rec.id = "m" + Date.now().toString(36) + Math.floor(Math.random() * 1000);
    db.materials.push(rec);
  }
  saveDB();
  closeModal();
  refreshAll();
  toast(id ? "已保存修改" : "已新增料号");
}

/* ================= 微型 xlsx 读写器（零依赖，基于 DecompressionStream / CompressionStream） =================
 * 读：扫 EOCD → 中央目录 → 局部头 → deflate-raw 解压；workbook.xml + rels 定位工作表；sharedStrings；DOMParser 解析。
 * 写：CRC32 + CompressionStream deflate-raw；inlineStr 免 sharedStrings。
 */
const XLSXL = (() => {
  const te = new TextEncoder(), td = new TextDecoder("utf-8");
  function u16(v){ return [v & 255, (v >> 8) & 255]; }
  function u32(v){ return [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]; }
  const CRC_T = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
    return t;
  })();
  function crc32(bytes){
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_T[(c ^ bytes[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function inflateRaw(u8){
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function deflateRaw(u8){
    const cs = new CompressionStream("deflate-raw");
    const stream = new Blob([u8]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function unzip(buf){
    const u8 = new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    const scanStart = Math.max(0, u8.length - 22);
    for (let i = scanStart; i >= Math.max(0, u8.length - 22 - 65536); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("不是有效的 xlsx（zip）文件");
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const files = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true);
      const elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true);
      const lhoff = dv.getUint32(off + 42, true);
      const name = td.decode(u8.subarray(off + 46, off + 46 + nlen));
      const lnlen = dv.getUint16(lhoff + 26, true);
      const lelen = dv.getUint16(lhoff + 28, true);
      const dstart = lhoff + 30 + lnlen + lelen;
      const cdata = u8.subarray(dstart, dstart + csize);
      files[name] = { method, cdata };
      off += 46 + nlen + elen + clen;
    }
    const out = {};
    for (const name of Object.keys(files)) {
      const f = files[name];
      out[name] = f.method === 8 ? await inflateRaw(f.cdata) : f.cdata;
    }
    return out;
  }
  async function zip(entries){
    const parts = [], central = [];
    let offset = 0;
    for (const e of entries) {
      const nameB = te.encode(e.name);
      const crc = crc32(e.data);
      const comp = e.store ? e.data : await deflateRaw(e.data);
      const method = e.store ? 0 : 8;
      const head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(method), u16(0), u16(0x21), u32(crc), u32(comp.length), u32(e.data.length), u16(nameB.length), u16(0));
      parts.push(new Uint8Array(head), nameB, comp);
      central.push({ nameB, crc, csize: comp.length, usize: e.data.length, method, offset });
      offset += head.length + nameB.length + comp.length;
    }
    const cStart = offset;
    for (const c of central) {
      const rec = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(c.method), u16(0), u16(0x21), u32(c.crc), u32(c.csize), u32(c.usize), u16(c.nameB.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset));
      parts.push(new Uint8Array(rec), c.nameB);
      offset += rec.length + c.nameB.length;
    }
    const cEnd = offset;
    parts.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(cEnd - cStart), u32(cStart), u16(0))));
    return new Blob(parts, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }
  function colToIdx(ref){
    const m = /^([A-Z]+)/.exec(ref);
    if (!m) return 0;
    let n = 0;
    for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  function idxToCol(i){
    let s = "";
    i = i + 1;
    while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function xmlEsc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])); }
  function parseSheetXML(doc, shared){
    const rows = [];
    const rowEls = doc.getElementsByTagName("row");
    for (const rowEl of rowEls) {
      const cells = [];
      const cEls = rowEl.getElementsByTagName("c");
      for (const c of cEls) {
        const idx = colToIdx(c.getAttribute("r") || "A1");
        const t = c.getAttribute("t");
        let v = null;
        if (t === "inlineStr") {
          const is = c.getElementsByTagName("is")[0];
          v = is ? is.textContent : "";
        } else {
          const vEl = c.getElementsByTagName("v")[0];
          if (vEl) {
            const txt = vEl.textContent;
            if (t === "s") v = shared[Number(txt)] !== undefined ? shared[Number(txt)] : txt;
            else if (t === "str" || t === "b") v = txt;
            else { const n = Number(txt); v = isNaN(n) ? txt : n; }
          }
        }
        while (cells.length <= idx) cells.push(null);
        cells[idx] = v;
      }
      while (cells.length && cells[cells.length - 1] === null) cells.pop();
      rows.push(cells);
    }
    return rows;
  }
  async function read(buf){
    if (typeof DecompressionStream === "undefined") throw new Error("当前浏览器不支持解压 xlsx，请用最新版 Edge / Chrome 打开");
    const files = await unzip(buf);
    const parser = new DOMParser();
    const shared = [];
    if (files["xl/sharedStrings.xml"]) {
      const ss = parser.parseFromString(td.decode(files["xl/sharedStrings.xml"]), "application/xml");
      const sis = ss.getElementsByTagName("si");
      for (const si of sis) shared.push(si.textContent);
    }
    const wbDoc = parser.parseFromString(td.decode(files["xl/workbook.xml"]), "application/xml");
    const relDoc = parser.parseFromString(td.decode(files["xl/_rels/workbook.xml.rels"]), "application/xml");
    const rels = {};
    const relEls = relDoc.getElementsByTagName("Relationship");
    for (const r of relEls) rels[r.getAttribute("Id")] = r.getAttribute("Target");
    const sheets = [];
    const sEls = wbDoc.getElementsByTagName("sheet");
    for (const s of sEls) {
      const name = s.getAttribute("name");
      const rid = s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      let target = rels[rid] || "";
      if (!target) continue;
      if (target.charAt(0) === "/") target = target.slice(1);
      else if (target.indexOf("xl/") !== 0) target = "xl/" + target;
      if (!files[target]) continue;
      const doc = parser.parseFromString(td.decode(files[target]), "application/xml");
      sheets.push({ name, rows: parseSheetXML(doc, shared) });
    }
    if (!sheets.length) throw new Error("xlsx 里没有可读取的工作表");
    return { sheets };
  }
  function sheetXML(rows){
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach((row, ri) => {
      x += '<row r="' + (ri + 1) + '">';
      row.forEach((v, ci) => {
        if (v === null || v === undefined || v === "") return;
        const ref = idxToCol(ci) + (ri + 1);
        if (typeof v === "number" && isFinite(v)) x += '<c r="' + ref + '"><v>' + v + "</v></c>";
        else x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + "</t></is></c>";
      });
      x += "</row>";
    });
    return x + "</sheetData></worksheet>";
  }
  async function write(sheets){
    if (typeof CompressionStream === "undefined") throw new Error("当前浏览器不支持生成 xlsx，请改用最新版 Edge / Chrome 打开");
    const names = sheets.map((s, i) => {
      const n = String(s.name || ("Sheet" + (i + 1))).replace(/[\[\]\*\?\/\\:]/g, " ").slice(0, 31).trim() || ("Sheet" + (i + 1));
      return n;
    });
    const entries = [];
    let ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
    names.forEach((n, i) => { ct += '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; });
    ct += "</Types>";
    entries.push({ name: "[Content_Types].xml", data: te.encode(ct) });
    entries.push({ name: "_rels/.rels", data: te.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });
    let wbx = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
    names.forEach((n, i) => { wbx += '<sheet name="' + xmlEsc(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; });
    wbx += "</sheets></workbook>";
    entries.push({ name: "xl/workbook.xml", data: te.encode(wbx) });
    let relx = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    names.forEach((n, i) => { relx += '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; });
    relx += "</Relationships>";
    entries.push({ name: "xl/_rels/workbook.xml.rels", data: te.encode(relx) });
    sheets.forEach((s, i) => { entries.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: te.encode(sheetXML(s.rows)) }); });
    return zip(entries);
  }
  return { read, write };
})();

/* ================= 导入导出 ================= */
function guard(p){ Promise.resolve(p).catch(e => { console.error(e); toast("操作失败：" + (e && e.message ? e.message : e), true); }); }
function toCSV(rows){
  return rows.map(r => r.map(c => {
    if (c === null || c === undefined) return "";
    const s = String(c);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
}
function stamp(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
}
/* 带时分秒：手动选位置时代，同一天导出多次也不会重名 */
function stampFull(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes());
}
function backupFileName(){ return "工时平台备份_" + stampFull() + ".json"; }
function exportModelXlsx(){
  guard(XLSXL.write(db.lines.map(line => ({ name: modelSheetName(line), rows: modelSheetRows(line) })))
    .then(blob => saveBlobAs(blob, "机种工时_" + stampFull() + ".xlsx", XLSX_MIME, "hours"))
    .then(afterSave));
}
function exportMatCsv(){
  guard(saveFileAs(toCSV(matExportRows()), "料号工时_" + stampFull() + ".csv", "text/csv", { kind: "hours" }).then(afterSave));
}
function downloadModelTemplate(){
  const sheets = db.lines.map(line => {
    const procs = db.procs[line] || [];
    const rt = routeList()[0] || "A0";
    const blank = procs.map(() => null);
    const mk = mh => [line + "-示例机种", line, mh, rt, null].concat(blank);
    return { name: modelSheetName(line), rows: [modelSheetHead(line), mk("机器"), mk("人工")] };
  });
  guard(XLSXL.write(sheets)
    .then(blob => saveBlobAs(blob, "机种工时导入模板_" + stampFull() + ".xlsx", XLSX_MIME, "hours"))
    .then(afterSave));
}
async function importModelHours(file){
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf.slice(0, 2));
  const isZip = u8[0] === 0x50 && u8[1] === 0x4B;      /* xlsx 本质是 zip，头两字节是 PK */
  let parsed;
  if (isZip) {
    try { parsed = await modelXlsxToEntries(buf); }
    catch (e) { parsed = { entries: [], problems: ["读取 xlsx 失败：" + (e && e.message ? e.message : e)], cells: 0 }; }
  } else {
    /* 兼容旧的 CSV 长格式（编码自适应：UTF-8 优先，乱码则退回 GBK） */
    let text = new TextDecoder("utf-8").decode(new Uint8Array(buf));
    if (text.indexOf("\uFFFD") >= 0) { try { text = new TextDecoder("gbk").decode(new Uint8Array(buf)); } catch (e) {} }
    parsed = modelCsvToEntries(parseCSV(text));
  }
  const entries = parsed.entries, problems = parsed.problems.slice();
  if (!entries.length) {
    openModal(`<h3>批量导入工时</h3><p>没有识别到可导入的数据行。<br>支持两种文件：<b>xlsx 工作簿</b>（每个产品线一个工作表，表头含「机种键、产品线、机器/人工、工艺路线、工时」+ 各工序列，可下载导入模板）；<b>旧版 CSV 长格式</b>。</p>
      ${problems.length ? '<div class="derive-box bad">' + problems.slice(0, 10).map(esc).join("<br>") + "</div>" : ""}
      <div class="foot"><button class="btn" data-action="modal-close">关闭</button></div>`);
    return;
  }
  // 机种归属校验：未建档的机种，其名称第一个「-」前必须等于产品线名，否则整组拒绝导入
  const valid = [], rejected = {};
  entries.forEach(e => {
    const inList = (db.models[e.line] || []).indexOf(e.model) >= 0;
    if (!inList && e.model.split("-")[0] !== e.line) {
      rejected[e.model + "（第一个「-」前不是「" + e.line + "」）"] = true;
    } else valid.push(e);
  });
  const rejList = Object.keys(rejected);
  const newModels = {};
  let cells = 0;
  valid.forEach(e => {
    if ((db.models[e.line] || []).indexOf(e.model) < 0) newModels[e.line + "|" + e.model] = true;
    cells += Object.keys(e.procVals).length;
  });
  if (!valid.length) {
    openModal(`<h3>批量导入工时</h3><p>所有机种都未通过归属校验，没有可导入的数据。</p>
      <div class="derive-box bad">${rejList.slice(0, 10).map(esc).join("<br>")}</div>
      <div class="foot"><button class="btn" data-action="modal-close">关闭</button></div>`);
    return;
  }
  state._import = valid;
  openModal(`<h3>批量导入工时 · 预览</h3>
    <div class="grid kpi" style="margin-bottom:10px">
      <div class="kpi"><div class="n">${cells}</div><div class="l">将更新的工序单元格</div></div>
      <div class="kpi"><div class="n">${valid.length}</div><div class="l">涉及组合（机种×路线×类型）</div></div>
      <div class="kpi"><div class="n">${Object.keys(newModels).length}</div><div class="l">自动新增机种</div></div>
      <div class="kpi"><div class="n">${problems.length + rejList.length}</div><div class="l">跳过 / 拒绝</div></div>
    </div>
    ${rejList.length ? '<div class="derive-box bad" style="margin-bottom:8px">以下机种名不属于对应产品线，整组拒绝导入：<br>' + rejList.slice(0, 10).map(esc).join("<br>") + "</div>" : ""}
    ${problems.length ? '<div class="derive-box bad" style="margin-bottom:8px">' + problems.slice(0, 10).map(esc).join("<br>") + (problems.length > 10 ? "<br>…共 " + problems.length + " 条" : "") + "</div>" : ""}
    <div class="muted">导入按单元格覆盖：表里<b>填了数值的工序</b>才更新；工序单元格<b>留空 = 保持原值不变</b>（想清零请填 0）；表里没有出现的工序同样保持原值。「工时」列是各工序之和，导入时忽略。</div>
    <div class="foot">
      <button class="btn" data-action="modal-close">取消</button>
      <button class="btn pri" data-action="model-import-apply">确认导入 ${cells} 个单元格</button>
    </div>`);
}
function applyModelImport(){
  const entries = state._import || [];
  let cells = 0;
  entries.forEach(e => {
    if ((db.models[e.line] || []).indexOf(e.model) < 0) db.models[e.line] = (db.models[e.line] || []).concat([e.model]);
    const h = ensureHours(e.line, e.model, e.route);
    const procs = db.procs[e.line] || [];
    ["机器", "人工"].forEach(mh2 => { while (h[mh2].length < procs.length) h[mh2].push(null); });
    Object.keys(e.procVals).forEach(proc => {
      const i = procs.indexOf(proc);
      if (i >= 0) { h[e.mh][i] = e.procVals[proc]; cells++; }
    });
  });
  saveDB();
  state._import = null;
  closeModal();
  refreshAll();
  toast("已更新 " + cells + " 个工序单元格");
}
async function importMaterials(file){
  const rows = parseCSV(await readTextSmart(file));
  const entries = [];
  const hi = rows.findIndex(r => r && r.some(c => String(c || "").trim() === "物料编码"));
  if (hi >= 0) {
    const head = rows[hi].map(c => String(c || "").trim());
    const col = {};
    head.forEach((h, i) => { col[h] = i; });
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r];
      const code = row && row[col["物料编码"]] !== null && row[col["物料编码"]] !== undefined ? String(row[col["物料编码"]]).trim() : "";
      if (!code) continue;
      const desc = col["物料描述"] !== undefined && row[col["物料描述"]] !== null && row[col["物料描述"]] !== undefined ? String(row[col["物料描述"]]).trim() : "";
      let route = col["工艺路线"] !== undefined && row[col["工艺路线"]] ? String(row[col["工艺路线"]]).trim() : "";
      if (routeList().indexOf(route) < 0) route = routeList()[0] || "";
      const note = col["备注"] !== undefined && row[col["备注"]] ? String(row[col["备注"]]).trim() : "";
      entries.push({ code, desc, route, note });

  if (!entries.length) {
    openModal(`<h3>批量导入料号</h3><p>没有识别到可导入的料号。CSV 需包含「物料编码」表头，可选列：物料描述 / 工艺路线 / 备注。</p>

    return;
  }
  const exist = new Set(db.materials.map(m => m["物料编码"]));
  const seen = new Set();
  const fresh = [], dup = [];
  entries.forEach(e => {
    if (exist.has(e.code) || seen.has(e.code)) { dup.push(e); return; }
    seen.add(e.code);
    fresh.push(e);
  });
  const withDerive = fresh.map(e => ({ e, r: deriveJizhong(e.code, e.desc) }));

  openModal(`<h3>批量导入料号 · 预览</h3>
    <div class="grid kpi" style="margin-bottom:10px">
      <div class="kpi"><div class="n">${fresh.length}</div><div class="l">将新增料号</div></div>
      <div class="kpi"><div class="n">${dup.length}</div><div class="l">重复编码跳过</div></div>
      <div class="kpi"><div class="n">${failCount}</div><div class="l">推导失败（导入后手动补）</div></div>
    </div>
    <div class="tblwrap" style="max-height:300px;overflow-y:auto"><table>
      <thead><tr><th>物料编码</th><th>物料描述</th><th>推导机种</th></tr></thead><tbody>${preview}</tbody>
    </table></div>
    <div class="foot">

/* ---- 账号文件（外置）：让账号跟着文件走 ----
   把「工时统计平台.账号.js」放在 HTML 同一个文件夹里，页面用 <script src> 读它
   （file:// 下 fetch / XHR / 动态 import 全被浏览器拦住，这是唯一可用通道；文件缺失时静默忽略）。
   合并规则：拿文件里的 issuedAt 当版本号 ——
     · 与本机上次应用过的版本不同、且不比它旧 → 用文件覆盖本机账号（管理员重新导出后，所有人下次打开即同步）；
     · 版本相同 → 保留本机账号（否则你在本机改的密码会被同一份文件反复冲掉）。
   文件里存的是 SHA-256 摘要，不含明文密码。 */
const ACCT_FILE_NAME = "工时统计平台.账号.js";
const ACCT_FILE_KEY  = "wb_gongshi_acct_file";     /* { ver, issuedAt }：本机已应用过的账号文件版本 */
function acctFileRaw(){
  const o = window.__GS_ACCOUNTS__;
  if (!o || !Array.isArray(o.accounts) || !o.accounts.length) return null;
  return o;
}
function acctFileVer(o){ return String(o.issuedAt || "") + "|" + o.accounts.length + "|" + JSON.stringify(o.accounts).length; }
function acctFileMark(){ try { return JSON.parse(localStorage.getItem(ACCT_FILE_KEY) || "null") || {}; } catch (e) { return {}; } }
function acctFileInfo(){
  const o = acctFileRaw();
  if (!o) return { present: false, applied: false };
  return { present: true, applied: acctFileMark().ver === acctFileVer(o), count: o.accounts.length, issuedAt: o.issuedAt || "", issuedBy: o.issuedBy || "" };
}
function acctFileShouldApply(o){
  const m = acctFileMark();
  if (m.ver === acctFileVer(o)) return false;                                       /* 同一份文件已应用过 → 保留本机 */
  if (m.issuedAt && (o.issuedAt || "") && o.issuedAt < m.issuedAt) return false;    /* 文件比本机应用过的更旧 → 不降级 */
  return true;
}
/* 生成账号文件内容（导出给别人的那份） */
function acctFileText(){

    + " * 密码以 SHA-256 摘要保存，不含明文；但摘要可被离线猜解，本文件不要外传。\n"
    + " * 由 " + (o.issuedBy || "—") + " 于 " + o.issuedAt + " 导出，共 " + list.length + " 个账号。\n"

async function pwdHash(pwd){
  const txt = "wbgs|" + String(pwd);
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return "s1:" + Array.prototype.map.call(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    /* 极端环境没有 crypto.subtle：退化为混淆串，仍不存明文 */
    let h1 = 5381, h2 = 52711;
    for (let i = 0; i < txt.length; i++) { const c = txt.charCodeAt(i); h1 = ((h1 * 33) ^ c) >>> 0; h2 = ((h2 * 31) + c) >>> 0; }
    return "f0:" + h1.toString(16) + h2.toString(16);
  }
}
/* 首次运行：优先采用同目录的账号文件；没有该文件时才创建默认「系统管理员 / abc123」 */
async function ensureAdminUser(){
  const o = acctFileRaw();
  if (o && acctFileShouldApply(o)) {
    const list = o.accounts.filter(x => x && x.name && x.pwd).map(x => ({
      name: String(x.name), pwd: String(x.pwd), title: x.title || "",
      role: x.role === "admin" ? "admin" : "user",
      createdAt: x.createdAt || new Date().toISOString(), lastLoginAt: x.lastLoginAt || null
    }));
    if (list.length) {
      usersSave(list);
      try { localStorage.setItem(ACCT_FILE_KEY, JSON.stringify({ ver: acctFileVer(o), issuedAt: o.issuedAt || "" })); } catch (e) {}
      return list;
    }
  }
  if (usersList().length) return usersList();
  const admin = { name: ADMIN_NAME, pwd: await pwdHash(ADMIN_PWD0), title: "系统管理员", role: "admin", createdAt: new Date().toISOString(), lastLoginAt: null };
  usersSave([admin]);
  return [admin];
}
async function doLogin(name, pwd){
  const u = userByName(name);
  if (!u) return { ok: false, msg: "账号「" + name + "」不存在，请联系系统管理员开通" };
  if (u.pwd !== await pwdHash(pwd)) return { ok: false, msg: "密码不正确" };
  try { sessionStorage.setItem(SESS_KEY, name); } catch (e) {}
  const list = usersList(); const t = list.find(x => x.name === name);
  if (t) { t.lastLoginAt = new Date().toISOString(); usersSave(list); }
  return { ok: true };
}

  _setState.tab = tab || _setState.tab || "me";
  openModal(`<h3>系统设置</h3>
    <div class="tabs" id="setTabs">${setTabBtn(_setState.tab, "me", "我的账号")}${setTabBtn(_setState.tab, "users", "账号管理")}${setTabBtn(_setState.tab, "dirs", "保存位置")}</div>
    <div id="setBody">${settingsBody(_setState.tab)}</div>
    <div class="foot"><button class="btn" data-action="modal-close">关闭</button></div>`);
  if (_setState.tab === "dirs") fillDirStates();
}
const DIR_EL = { hours: "#dirStHours", json: "#dirStJson", acct: "#dirStAcct" };
async function fillDirStates(){
  for (const kind of ["hours", "json", "acct"]) {
    const el = $(DIR_EL[kind]);
    if (!el) continue;
    let d = null, l = null;
    try { d = await fsIdbGet(DIR_SLOT[kind]); l = await fsIdbGet(LAST_SLOT[kind]); } catch (e) {}
    if (!el.parentNode) continue;
    el.innerHTML = d
      ? `已指定：<b>${esc(d.name)}</b>`
      : (l ? `未指定（当前会用到上次导出的位置：<b>${esc(l.name)}</b>）` : "未指定（首次导出默认落在桌面）");
  }
}

/* ================= 事件调度（统一入口，改数据 → refreshAll，渲染函数互不调用） ================= */
const _deb = {};
function deb(key, fn, ms){ clearTimeout(_deb[key]); _deb[key] = setTimeout(fn, ms); }

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  const d = el.dataset;

  if (a === "nav") { state.page = d.page; refreshAll(); return; }
  if (a === "goto-mat") { state.matFilter = { line: "", route: "", q: "", bad: d.bad || "" }; state.matPage = 1; state.page = "mat"; refreshAll(); return; }
  if (a === "modal-close") { closeModal(); return; }

  /* ---- 登录 / 系统设置 / 账号 ---- */
  if (a === "login-do") {
    const n = ($("#lgUser") ? $("#lgUser").value : "").trim();
    const p = ($("#lgPwd") ? $("#lgPwd").value : "");
    const err = $("#lgErr");
    if (!n || !p) { if (err) err.textContent = "请输入账号和密码"; return; }
    if (err) err.textContent = "";
    doLogin(n, p).then(function(r){
      if (!r.ok) { if (err) err.textContent = r.msg; return; }
      startApp();
      toast("欢迎，" + n);
    }).catch(function(e){ if (err) err.textContent = "登录失败：" + ((e && e.message) || "未知错误"); });
    return;
  }
  if (a === "acct-open") { openSettings("me"); return; }
  if (a === "acct-export-file") { exportAcctFile(); return; }
  if (a === "set-tab") { openSettings(d.tab); return; }
  if (a === "acct-logout") { doLogout(); return; }
  if (a === "pwd-change") {
    const u = userCurrent(); if (!u) return;
    const o = $("#pwOld") ? $("#pwOld").value : "";
    const n1 = $("#pwNew") ? $("#pwNew").value : "";
    const n2 = $("#pwNew2") ? $("#pwNew2").value : "";
    if (!o || !n1 || !n2) { toast("请把三个密码框都填上", true); return; }
    if (n1.length < 4) { toast("新密码至少 4 位", true); return; }
    if (n1 !== n2) { toast("两次输入的新密码不一致", true); return; }
    pwdHash(o).then(function(oh){
      if (u.pwd !== oh) { toast("当前密码不正确", true); return null; }
      return pwdHash(n1).then(function(nh){
        const list = usersList(); const t = list.find(x => x.name === u.name);
        if (!t) { toast("账号状态异常，请重新登录", true); return; }
        t.pwd = nh; usersSave(list);
        openSettings("me"); toast("密码已更新");
      });
    }).catch(function(e){ toast("修改失败：" + ((e && e.message) || "错误"), true); });
    return;
  }
  if (a === "acct-add") {
    if (!isAdmin()) { toast("只有系统管理员可以新增账号", true); return; }
    openModal(`<h3>新增账号</h3>
      <p class="muted" style="margin:0 0 10px">给同事开一个登录账号。初始密码告诉对方，对方登录后可在「我的账号」里自行修改。</p>
      <label class="fl"><span>账号 *</span><input type="text" id="nuName" autocomplete="off" placeholder="如 张三 / IE-李四"></label>
      <label class="fl" style="margin-top:8px"><span>职位</span><input type="text" id="nuTitle" autocomplete="off" placeholder="如 生产主管 / IE工程师"></label>
      <label class="fl" style="margin-top:8px"><span>初始密码 *</span><input type="text" id="nuPwd" autocomplete="off" value="abc123"></label>
      <label class="fl" style="margin-top:8px"><span>角色</span><select id="nuRole" style="width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)"><option value="user">普通账号</option><option value="admin">管理员</option></select></label>
      <div class="foot"><button class="btn" data-action="set-tab" data-tab="users">取消</button><button class="btn pri" data-action="acct-add-save">创建账号</button></div>`);
    setTimeout(function(){ const i = $("#nuName"); if (i) i.focus(); }, 30);
    return;
  }
  if (a === "acct-add-save") {
    if (!isAdmin()) return;
    const nm = ($("#nuName") ? $("#nuName").value : "").trim();
    const ti = ($("#nuTitle") ? $("#nuTitle").value : "").trim();
    const np = ($("#nuPwd") ? $("#nuPwd").value : "").trim();
    const ro = ($("#nuRole") ? $("#nuRole").value : "user");
    if (!nm) { toast("账号不能为空", true); return; }
    if (np.length < 4) { toast("初始密码至少 4 位", true); return; }
    if (userByName(nm)) { toast("账号「" + nm + "」已存在", true); return; }
    if (usersList().length >= 30) { toast("账号数已达上限（30 个）", true); return; }
    pwdHash(np).then(function(nh){
      const list = usersList();
      list.push({ name: nm, pwd: nh, title: ti, role: ro === "admin" ? "admin" : "user", createdAt: new Date().toISOString(), lastLoginAt: null });
      usersSave(list);
      openSettings("users"); toast("已创建账号：" + nm);
    });
    return;
  }
  if (a === "acct-reset") {
    if (!isAdmin()) { toast("只有系统管理员可以重置他人密码", true); return; }
    const nm = d.name || "";
    openModal(`<h3>重置密码</h3>
      <p class="muted" style="margin:0 0 10px">给「<b>${esc(nm)}</b>」设一个新的初始密码，并告知对方；对方登录后可在「我的账号」里再改。</p>
      <label class="fl"><span>新密码 *</span><input type="text" id="rsPwd" value="abc123" autocomplete="off"></label>
      <div class="foot"><button class="btn" data-action="set-tab" data-tab="users">取消</button><button class="btn pri" data-action="acct-reset-save" data-name="${esc(nm)}">确认重置</button></div>`);
    return;
  }
  if (a === "acct-reset-save") {
    if (!isAdmin()) return;
    const nm = d.name || "";
    const np = ($("#rsPwd") ? $("#rsPwd").value : "").trim();
    if (np.length < 4) { toast("密码至少 4 位", true); return; }
    pwdHash(np).then(function(nh){
      const list = usersList(); const t = list.find(x => x.name === nm);
      if (!t) { toast("账号不存在", true); return; }
      t.pwd = nh; usersSave(list);
      openSettings("users"); toast("「" + nm + "」的密码已重置");
    });
    return;
  }
  if (a === "dir-pick") {
    const kind = normKind(d.kind);
    if (typeof window.showDirectoryPicker !== "function") { toast("当前浏览器不支持选择文件夹，请改用 Edge / Chrome", true); return; }
    pickDirFor(kind).then(function(h){ fillDirStates(); toast("已指定：" + h.name); })
      .catch(function(e){ if (e && e.name === "AbortError") return; toast("选择文件夹失败：" + ((e && e.name) || "未知错误"), true); });
    return;
  }
  if (a === "dir-clear") {
    clearDirFor(normKind(d.kind)).then(function(){ fillDirStates(); toast("已清除，之后按「上次位置 → 桌面」回落"); });
    return;
  }

  /* ---- 基础配置 ---- */
  if (a === "route-add") {
    const code = $("#rtCode").value.trim(), name = $("#rtName").value.trim(), desc = $("#rtDesc").value.trim();
    if (!code) { toast("路线代码不能为空", true); return; }
    if (routeList().indexOf(code) >= 0) { toast("路线代码「" + code + "」已存在", true); return; }
    db.routes.push({ code, name: name || code, desc });
    saveDB(); refreshAll(); toast("已增加路线 " + code); return;
  }
  if (a === "route-rename") {
    const r = db.routes.find(x => x.code === d.code);
    if (!r) return;
    const nv = prompt("路线「" + r.code + "」的名称：", r.name);
    if (nv === null) return;
    r.name = nv.trim() || r.name;
    const nd = prompt("说明（可留空）：", r.desc || "");
    if (nd !== null) r.desc = nd.trim();
    saveDB(); refreshAll(); return;
  }
  if (a === "route-del") {
    const code = d.code;
    const used = Object.keys(db.hours).filter(k => k.split("|")[2] === code).length;
    const mats = db.materials.filter(m => m["工艺路线"] === code).length;
    if (!confirm("删除路线「" + code + "」？\n· 该路线下 " + used + " 条工时记录会被删除\n· " + mats + " 条料号的路线会改为「" + (routeList().filter(x => x !== code)[0] || "无") + "」\n确定继续？")) return;
    db.routes = db.routes.filter(x => x.code !== code);
    Object.keys(db.hours).forEach(k => { if (k.split("|")[2] === code) delete db.hours[k]; });
    const fallback = routeList()[0] || "";
    db.materials.forEach(m => { if (m["工艺路线"] === code) m["工艺路线"] = fallback; });
    saveDB(); refreshAll(); toast("已删除路线 " + code); return;
  }
  if (a === "base-line") { state.baseLine = d.line; refreshAll(); return; }
  if (a === "proc-add") {
    const line = state.baseLine;
    const name = $("#procName").value.trim();
    if (!name) { toast("工序名称不能为空", true); return; }
    if ((db.procs[line] || []).indexOf(name) >= 0) { toast("工序「" + name + "」已存在", true); return; }
    db.procs[line] = (db.procs[line] || []).concat([name]);
    Object.keys(db.hours).forEach(k => {
      if (k.split("|")[0] === line) { db.hours[k]["机器"].push(null); db.hours[k]["人工"].push(null); }
    });
    saveDB(); refreshAll(); toast("已增加工序「" + name + "」"); return;
  }
  if (a === "proc-rename") {
    const line = d.line, i = Number(d.idx);
    const old = db.procs[line][i];
    const nv = prompt("工序改名（不影响已录工时）：", old);
    if (nv === null) return;
    const name = nv.trim();
    if (!name) { toast("名称不能为空", true); return; }
    if (db.procs[line].indexOf(name) >= 0 && name !== old) { toast("工序「" + name + "」已存在", true); return; }
    db.procs[line][i] = name;
    saveDB(); refreshAll(); return;
  }
  if (a === "proc-del") {
    const line = d.line, i = Number(d.idx);
    const name = db.procs[line][i];
    if (!confirm("删除「" + line + "」的工序「" + name + "」？该产品线所有机种已录的该列工时会被一并删除，确定继续？")) return;
    db.procs[line].splice(i, 1);
    Object.keys(db.hours).forEach(k => {
      if (k.split("|")[0] === line) { db.hours[k]["机器"].splice(i, 1); db.hours[k]["人工"].splice(i, 1); }
    });
    saveDB(); refreshAll(); toast("已删除工序「" + name + "」"); return;
  }
  if (a === "proc-move") {
    const line = d.line, i = Number(d.idx), dir = Number(d.dir);
    const j = i + dir, arr = db.procs[line];
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    Object.keys(db.hours).forEach(k => {
      if (k.split("|")[0] === line) {
        ["机器", "人工"].forEach(mh => {
          const a2 = db.hours[k][mh];
          if (i < a2.length && j < a2.length) [a2[i], a2[j]] = [a2[j], a2[i]];
        });
      }
    });
    saveDB(); refreshAll(); return;
  }

  /* ---- 机种工时 ---- */
  if (a === "m-line") { state.mLine = d.line; state.mModel = null; state.mSearch = ""; refreshAll(); return; }
  if (a === "m-pick") { state.mModel = d.model; refreshAll(); return; }
  if (a === "model-add") { openModelAddModal(); return; }
  if (a === "model-add-save") {
    const line = state.mLine;
    const inp = $("#maKey");
    const k2 = (inp ? inp.value : "").trim();
    if (!k2) { toast("机种键不能为空", true); return; }
    if (k2.split("-")[0] !== line) { toast("机种名「" + k2 + "」不属于产品线「" + line + "」：机种名第一个「-」前必须是「" + line + "」", true); return; }
    if ((db.models[line] || []).indexOf(k2) >= 0) { toast("该机种已存在", true); return; }
    db.models[line] = (db.models[line] || []).concat([k2]);
    state.mModel = k2;
    state.mSearch = "";
    closeModal(); saveDB(); refreshAll(); toast("已增加机种"); return;
  }
  if (a === "model-del") {
    const line = state.mLine, model = state.mModel;
    if (!model) return;
    const ref = db.materials.filter(m => m["产品线"] === line && m["机种"] === model).length;
    if (!confirm("删除机种「" + model + "」？\n· 该机种所有工艺路线下的工时会一并删除" + (ref ? "\n· " + ref + " 条料号引用它，删除后这些料号将显示缺工时" : "") + "\n确定继续？")) return;
    db.models[line] = (db.models[line] || []).filter(x => x !== model);
    Object.keys(db.hours).forEach(k => { if (k.indexOf(line + "|" + model + "|") === 0) delete db.hours[k]; });
    state.mModel = null;
    saveDB(); refreshAll(); toast("已删除机种"); return;
  }
  if (a === "model-template") { guard(downloadModelTemplate()); return; }
  if (a === "model-export-xlsx") { exportModelXlsx(); return; }
  if (a === "model-import") { pickFile(".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv", f => guard(importModelHours(f))); return; }
  if (a === "model-import-apply") { applyModelImport(); return; }

  /* ---- 料号工时 ---- */
  if (a === "mat-add") { openMatModal(null); return; }
  if (a === "mat-edit") { openMatModal(d.id); return; }
  if (a === "mat-save") { saveMatFromModal(); return; }
  if (a === "mat-del") {
    const m = db.materials.find(x => x.id === d.id);
    if (!m) return;
    if (!confirm("删除料号「" + m["物料编码"] + "」？")) return;
    db.materials = db.materials.filter(x => x.id !== d.id);
    saveDB(); refreshAll(); toast("已删除料号"); return;
  }
  if (a === "mat-page") { state.matPage += Number(d.dir); updateMatTable(); return; }
  if (a === "mat-export-csv") { exportMatCsv(); return; }
  if (a === "mat-import") { pickFile(".csv,text/csv", f => guard(importMaterials(f))); return; }
  if (a === "mat-import-apply") { applyMatImport(); return; }

  /* ---- 数据管理 ---- */
  if (a === "export-json") {
    guard(saveFileAs(JSON.stringify(db), backupFileName(), "application/json", { bom: false, kind: "json" }).then(function(res){
      if (!res || res.cancelled) { toast("已取消保存，不记为已备份", true); return; }
      db.meta.lastBackupAt = new Date().toISOString();   /* 只有真写盘成功才记备份时间 */
      saveDB(); refreshAll();
      afterSave(res);
    }));
    return;
  }
  if (a === "import-json") {
    pickFile(".json,application/json", f => {
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const obj = JSON.parse(String(rd.result));
          if (!obj || !obj.routes || !obj.lines || !obj.procs || !obj.models || !obj.hours || !obj.materials) throw new Error("文件结构不完整，不是本平台的备份");
          db = obj;
          if (!db.meta) db.meta = { ver: 1 };
          saveDB(); refreshAll(); toast("已恢复备份数据");
        } catch (e) { toast("导入失败：" + e.message, true); }
      };
      rd.readAsText(f, "utf-8");
    }); return;
  }
  if (a === "clear-data") {
    if (!confirm("将清空全部料号与已录工时（保留工艺路线 / 工序 / 机种清单），不可撤销。\n建议先导出 JSON 备份。确定继续？")) return;
    if (!confirm("再次确认：删除后只能通过 JSON 备份恢复，确定清空？")) return;
    db.materials = [];
    db.hours = {};
    saveDB(); refreshAll(); toast("已清空料号与工时数据"); return;
  }
  if (a === "reset-seed") {
    if (!confirm("将放弃当前所有修改，恢复到首次打开的初始数据（含示例）。确定继续？")) return;
    db = defaultDB();
    saveDB(); refreshAll(); toast("已恢复初始数据"); return;
  }
});

document.addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-change]");
  if (!el) return;
  const t = el.dataset.change, d = el.dataset;
  if (t === "m-route") { state.mRoute = el.value; refreshAll(); return; }
  if (t === "hour-cell") {
    const line = d.line, model = d.model, route = d.route, mh = d.mh, idx = Number(d.idx);
    const h = ensureHours(line, model, route);
    const n = (db.procs[line] || []).length;
    while (h[mh].length < n) h[mh].push(null);
    const v = el.value.trim();
    h[mh][idx] = v === "" ? null : (isNaN(Number(v)) ? null : Number(v));
    saveDB();
    const tr = el.closest("tr");
    if (tr && tr.children[1]) tr.children[1].innerHTML = "<b>" + fmtNum(sumArr(h[mh])) + "</b>";
    updateBadge();
    return;
  }
  if (t === "mat-route") {
    const m = db.materials.find(x => x.id === d.id);
    if (!m) return;
    m["工艺路线"] = el.value;
    saveDB();
    const tr = document.querySelector('tr[data-mrow="' + m.id + '"]');
    if (tr) {
      const invalid = m["机种"] === "编码不符合命名规则" || !m["机种"];
      const calc = invalid ? { ok: false } : materialCalc(m);
      tr.querySelector(".c-machine").innerHTML = calc.ok ? fmtNum(calc.machine) : '<span class="pill warn">缺工时</span>';
      tr.querySelector(".c-human").innerHTML = calc.ok ? fmtNum(calc.human) : "—";
      tr.querySelector(".c-fee").innerHTML = calc.ok ? fmtNum(calc.fee, 8) : "—";
    }
    updateBadge();
    return;
  }
  if (t === "mat-f-line") { state.matFilter.line = el.value; state.matPage = 1; updateMatTable(); return; }
  if (t === "mat-f-route") { state.matFilter.route = el.value; state.matPage = 1; updateMatTable(); return; }
  if (t === "mat-f-bad") { state.matFilter.bad = el.value; state.matPage = 1; updateMatTable(); return; }
  if (t === "f-line") { state._fLine = el.value; fillModelSelect(el.value, ""); return; }
});

document.addEventListener("input", (ev) => {
  const el = ev.target.closest("[data-input]");
  if (!el) return;
  const t = el.dataset.input;
  if (t === "mat-q") { deb("q", () => { state.matFilter.q = el.value; state.matPage = 1; updateMatTable(); }, 250); return; }
  if (t === "derive") { deb("derive", refreshDeriveBox, 200); return; }
  if (t === "m-search") { deb("ms", () => { state.mSearch = el.value; renderModelList(); }, 200); return; }
});

/* 增加机种弹窗：输入框内回车 = 确定，实时提示前缀是否合规 */

$("#modalMask").addEventListener("click", (ev) => { if (ev.target === ev.currentTarget) closeModal(); });

/* ================= 初始化：先过登录门禁（未登录不加载、不渲染任何业务数据） ================= */
function showLoginGate(){
  document.body.classList.add("locked");
  const g = $("#loginGate"); if (g) g.classList.remove("hide");
  const i = $("#lgUser"); if (i) setTimeout(() => i.focus(), 60);
}
function startApp(){
  document.body.classList.remove("locked");
  const g = $("#loginGate"); if (g) g.classList.add("hide");
  loadDB();
  state.mLine = db.lines[0] || null;
  state.mRoute = routeList()[0] || null;
  state.baseLine = db.lines[0] || null;
  updateUpdTime();
  updateBkTime();
  warmStartIn();                        /* 预热两组保存位置，让点击导出时不卡用户手势 */
  refreshAll();
}
/* 登录框里回车直接提交 */
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  const id = ev.target && ev.target.id;
  if (id === "lgUser" || id === "lgPwd") {
    const b = document.querySelector("[data-action='login-do']");
    if (b) b.click();
  }
});
document.addEventListener("DOMContentLoaded", async () => {
  try { await ensureAdminUser(); } catch (e) {}
  if (userCurrent()) startApp();
  else showLoginGate();
});


/* ================= 模块：使用说明（静态文档页） ================= */
function renderHelpPage(){
  const h = [];
  const card = (title, tag, body) => `<div class="card"><h2>${title}${tag ? ' <span class="tag">' + tag + '</span>' : ''}</h2>${body}</div>`;
  const tbl = (head, rows, cls) => `<div class="tblwrap"><table${cls ? ' class="' + cls + '"' : ''}><thead><tr>${head.map(x => '<th>' + x + '</th>').join("")}</tr></thead><tbody>${rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join("") + '</tr>').join("")}</tbody></table></div>`;

  h.push(`<div class="card" style="border-left:4px solid var(--brand)">
    <h2>工时统计平台 · 使用说明</h2>
    <p class="lead">本页说明平台的<b>数据逻辑</b>与<b>操作方法</b>。机种字段规则取自《机种字段映射图》与《机种字段取值规则清单》，与平台内推导引擎完全一致。</p>
    <div class="row" style="margin-top:10px">
      <button class="btn" data-action="nav" data-page="model">去录入机种工时</button>
      <button class="btn" data-action="nav" data-page="mat">去查料号工时</button>
      <button class="btn" data-action="nav" data-page="data">数据管理</button>
    </div>
  </div>`);

  /* 0. 登录与账号 */
  h.push(card("登录与账号", "进入平台的第一道门", `
    <ul class="hp-list">
      <li><b>打开平台先登录</b>：未登录时页面<b>不会加载、也不会显示任何工时数据</b>。首次使用的默认账号是 <b>系统管理员</b>，初始密码 <b>abc123</b>。</li>
      <li><b>登录状态只保留到关闭页面为止</b>：关掉标签页或浏览器后再打开需要重新登录 —— 这是为了让工时数据不被别人顺手看到。</li>
      <li><b>左下角「系统设置」</b>是账号与保存位置的唯一入口：改自己的密码、看账号明细、指定默认保存位置、退出登录。</li>
      <li><b>谁能加账号</b>：只有<b>系统管理员</b>能新增账号、重置他人密码；每个账号都可以在「我的账号」里改自己的密码。</li>
      <li>登录后的账号<b>都能查看全部工时与料号明细</b>，账号之间不区分数据权限。</li>
      <li><b>账号只存在这台电脑的这个浏览器里</b>：不随 JSON 备份导出。换电脑、重装浏览器后需要重新开通账号。</li>
      <li><b>想让账号跟着文件走</b>：到「系统设置 → 账号管理」点<b>导出账号文件</b>，把生成的 <b>工时统计平台.账号.js</b> 放到平台文件<b>同一个文件夹</b>里，再连平台一起发给同事 —— 对方双击打开就是这套账号，不用一个个重新开通。以后改了账号，<b>导出一次覆盖旧文件</b>，所有人下次打开即同步。</li>

    </ul>`));

  /* 1. 数据存在哪里 */
  h.push(card("① 数据存在哪里", "务必先看", `
    <ul class="hp-list">
      <li>所有数据保存在<b>本机浏览器</b>（localStorage），<b>不上传任何服务器</b>，公司内外网都可用。</li>
      <li>换电脑、换浏览器、清理浏览器数据都会丢失 → <b>请定期在「数据管理」点「导出 JSON 备份」</b>。</li>

      <li>登录用的<b>账号与密码不在数据里</b>：账号单独存本机，<b>不会随 JSON 备份一起导出</b>。</li>
